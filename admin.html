<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Halaman Admin - Langgeng Lestari</title>
<style>
    body {
        font-family: 'Arial', sans-serif;
        background-color: #f4f9f4;
        margin: 0;
        padding: 20px;
    }
    h2 {
        text-align: center;
        color: #388e3c;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    th, td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: left;
    }
    th {
        background-color: #e0e0e0;
    }
    button {
        margin-top: 20px;
        padding: 10px 15px;
        background-color: #d32f2f;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        background-color: #b71c1c;
    }
</style>
</head>
<body>
<h2>Data Pendaftaran</h2>
<div id="dataContainer">Memuat data...</div>
<button onclick="logout()">Logout</button>

<script>
    // URL API Google Apps Script
    const getDataUrl = 'https://script.google.com/macros/s/AKfycbwri-uZChRpUBtE8ac-Lz7KoNZvCkORFVRt0ptY3ug1mERjKoOTfogwYV5PGPsPu-IpGg/exec'; // Ganti dengan URL GET data
    const saveDataUrl = 'https://script.google.com/macros/s/AKfycbwri-uZChRpUBtE8ac-Lz7KoNZvCkORFVRt0ptY3ug1mERjKoOTfogwYV5PGPsPu-IpGg/exec'; // Ganti dengan URL POST data

    // Cek login
    if (localStorage.getItem('adminLoggedIn') !== 'true') {
        window.location.href = 'admin_login.html';
    }

    // Fungsi logout
    function logout() {
        localStorage.removeItem('adminLoggedIn');
        window.location.href = 'admin_login.html';
    }

    // Fungsi untuk ambil data dari Google Sheets
    function fetchData() {
        fetch(getDataUrl)
            .then(res => res.json())
            .then(data => {
                tampilkanData(data);
            })
            .catch(error => {
                document.getElementById('dataContainer').innerHTML = 'Gagal memuat data.';
                console.error('Error:', error);
            });
    }

    // Fungsi untuk tampilkan data ke tabel
    function tampilkanData(data) {
        if (!data || data.length === 0) {
            document.getElementById('dataContainer').innerHTML = 'Tidak ada data.';
            return;
        }
        let html = '<table><tr><th>Nama</th><th>Email</th><th>Nomor HP</th></tr>';
        data.forEach(row => {
            html += `<tr><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td></tr>`;
        });
        html += '</table>';
        document.getElementById('dataContainer').innerHTML = html;
    }

    // Panggil fetchData saat halaman dimuat
    window.onload = fetchData;
</script>
</body>
</html>
